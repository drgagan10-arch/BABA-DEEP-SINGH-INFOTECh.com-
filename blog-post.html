<!-- Mobile Hamburger Menu Script -->
<script>
  (function() {
    const menuBtn = document.querySelector('.mobile-menu-btn');
    const navLinks = document.querySelector('.nav-links');
    if (!menuBtn || !navLinks) return;
    
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      navLinks.classList.toggle('active');
    });
    
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
      });
    });
  })();
</script>

<!-- Single Blog Post Loader (from Firestore) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAbeKLO-fq6vwjx8Fyd3ONa_WdIVTi58k4",
    authDomain: "bdsifotech.firebaseapp.com",
    projectId: "bdsifotech",
    storageBucket: "bdsifotech.firebasestorage.app",
    messagingSenderId: "487791641568",
    appId: "1:487791641568:web:55df83e7668da810e62185"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const postId = urlParams.get("id");
  const container = document.getElementById("singlePost");

  if (postId) {
    const docRef = doc(db, "blogPosts", postId);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      const post = docSnap.data();
      container.innerHTML = `
        <h1>${escapeHtml(post.title)}</h1>
        <p style="color: var(--text-light); margin-bottom: 1rem;">
          <i class="fas fa-calendar-alt"></i> ${post.date ? new Date(post.date.toDate()).toLocaleDateString() : "Recent"}
        </p>
        <img src="${escapeHtml(post.image)}" alt="${escapeHtml(post.title)}" style="width:100%; max-height:400px; object-fit:cover; border-radius:1rem; margin:1rem 0;">
        <div style="font-size: 1.125rem; line-height: 1.7;">${post.content}</div>
        <a href="blog.html" class="btn btn-outline" style="margin-top: 2rem; display: inline-block;">← Back to Blog</a>
      `;
    } else {
      container.innerHTML = `<p>Post not found. <a href="blog.html">Return to blog</a></p>`;
    }
  } else {
    container.innerHTML = `<p>No post specified. <a href="blog.html">View all posts</a></p>`;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
</script>

</body>
