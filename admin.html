<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Baba Deep Singh Infotech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="js/main.js"></script>
</head>
<body>
<div id="loader"><div class="spinner"></div></div>

<nav class="navbar">...same as index, active Admin...</nav>

<main class="container section">
  <div id="adminLogin" class="admin-login">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Enter password" style="width:100%; padding:0.75rem;">
    <button id="loginBtn" class="btn" style="margin-top:1rem;">Login</button>
  </div>

  <div id="adminDashboard" style="display:none;">
    <h2>Contact Messages</h2>
    <div id="messagesList"></div>

    <h2>Add New Blog Post</h2>
    <form id="addBlogForm">
      <input type="text" id="blogTitle" placeholder="Title" required><br>
      <textarea id="blogContent" placeholder="Full content" rows="5"></textarea><br>
      <input type="text" id="blogImage" placeholder="Image URL" value="https://images.unsplash.com/photo-1581091226033-d5c48150dbaa?w=600"><br>
      <input type="text" id="blogExcerpt" placeholder="Short excerpt"><br>
      <button type="submit" class="btn">Add Post</button>
    </form>

    <h2>Manage Blog Posts</h2>
    <div id="blogListAdmin"></div>

    <h2>Add Portfolio Item</h2>
    <form id="addPortfolioForm">
      <input type="text" id="portTitle" placeholder="Title"><br>
      <select id="portCategory"><option value="web">Web</option><option value="app">App</option><option value="branding">Branding</option></select><br>
      <input type="text" id="portImage" placeholder="Image URL"><br>
      <textarea id="portDesc" placeholder="Description"></textarea><br>
      <button type="submit" class="btn">Add Portfolio</button>
    </form>
    <div id="portfolioListAdmin"></div>
  </div>
</main>

<footer class="footer">...</footer>
<script>/* mobile menu */</script>
</body>
</html>
