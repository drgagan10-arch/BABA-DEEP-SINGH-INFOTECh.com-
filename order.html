<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Baba Deep Singh Infotech</title>
<meta name="description" content="Submit your project requirements.">
<meta name="keywords" content="Order Website, Project Inquiry, Web Development Quote">
<meta name="author" content="Baba Deep Singh Infotech">

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Montserrat:wght@400;600&display=swap');

*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',sans-serif;background:radial-gradient(circle at top,#1b1f3a,#050512);color:#fff;overflow-x:hidden;}
.container{max-width:1200px;margin:auto;padding:100px 20px 40px}
h1,h2{font-family:'Orbitron',sans-serif;color:#ffb700;text-shadow:0 0 20px #ffb700}
.btn{padding:14px 40px;border:none;border-radius:50px;background:#ffb700;font-weight:700;cursor:pointer;box-shadow:0 0 30px #ffb700}
.btn:hover{transform:scale(1.05)}
nav{position:fixed;top:0;left:0;width:100%;padding:15px 30px;display:flex;justify-content:space-between;background:#050512;z-index:999}
nav a{color:white;margin-left:25px;text-decoration:none;font-weight:600}
nav a:hover{color:#ffb700}
.logo{font-family:'Orbitron',sans-serif;font-size:1.6rem;color:#ffb700}
input,textarea{width:100%;padding:12px;margin:10px 0 20px;border-radius:10px;border:none}
input:focus,textarea:focus{outline:none;box-shadow:0 0 15px #ffb700}
</style>
</head>
<body>

<nav>
  <div class="logo">BDS INFOTECH</div>
  <div>
    <a href="index.html">Home</a>
    <a href="order.html">Order</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
    <a href="terms.html">Terms</a>
    <a href="privacy.html">Privacy</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="container">
  <h2>Order / Query Department</h2>
  <form id="orderForm">
    <input id="name" placeholder="Name" required>
    <input id="mobile" type="tel" pattern="[0-9]{10}" placeholder="Mobile" required>
    <textarea id="message" placeholder="Your requirement" required></textarea>
    <button class="btn">Submit</button>
    <p id="success"></p>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAEtw-mrf6PPOaCxtpEJeL8swkG0GgQ8Jc",
    authDomain: "infotech-e1174.firebaseapp.com",
    projectId: "infotech-e1174",
    storageBucket: "infotech-e1174.firebasestorage.app",
    messagingSenderId: "243395836512",
    appId: "1:243395836512:web:3d0705c6bcaf0fe452a105"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Form submit
  const form = document.getElementById("orderForm");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await addDoc(collection(db,"orders"), {
        name: document.getElementById("name").value,
        mobile: document.getElementById("mobile").value,
        message: document.getElementById("message").value,
        createdAt: serverTimestamp()
      });
      document.getElementById("success").textContent = "Submitted successfully!";
      form.reset();
    } catch(err){
      alert("Error: " + err.message);
    }
  });
</script>

<script src="//code.tidio.co/dv5czpqkesrmkbifmdrklpg1nuyttoza.js" async></script>

</body>
</html>
