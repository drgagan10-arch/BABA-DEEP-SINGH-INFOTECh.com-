<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Portfolio | Baba Deep Singh Infotech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- NO LOADER DIV AT ALL -->

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">🟢 BABA DEEP SINGH INFOTECH</a>
    <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="portfolio.html" class="active">Portfolio</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</nav>

<main class="container section">
  <h1>Our Recent Work</h1>
  <p style="text-align: center; margin-bottom: 2rem;">Explore some of our successful projects delivered for satisfied clients.</p>
  <div id="portfolioGrid" class="portfolio-grid">
    <p>Loading portfolio items...</p>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p>&copy; 2025 Baba Deep Singh Infotech. All rights reserved.</p>
  </div>
</footer>

<a href="#" onclick="startProject()" class="whatsapp-float"><i class="fab fa-whatsapp"></i></a>

<script>
  // Define WhatsApp function
  window.startProject = function() {
    const phone = "918221826243";
    const msg = "Hi, I want to start a project for my website. Please share your expertise and pricing.";
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
  };

  // Hamburger menu
  (function() {
    const menuBtn = document.querySelector('.mobile-menu-btn');
    const navLinks = document.querySelector('.nav-links');
    if (menuBtn && navLinks) {
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        navLinks.classList.toggle('active');
      });
      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => navLinks.classList.remove('active'));
      });
    }
  })();

  // Load portfolio from Firestore
  (async function() {
    const container = document.getElementById('portfolioGrid');
    container.innerHTML = '<p>Loading portfolio items...</p>';
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js");
      const { getFirestore, collection, getDocs } = await import("https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js");
      
      const firebaseConfig = {
        apiKey: "AIzaSyAbeKLO-fq6vwjx8Fyd3ONa_WdIVTi58k4",
        authDomain: "bdsifotech.firebaseapp.com",
        projectId: "bdsifotech",
        storageBucket: "bdsifotech.firebasestorage.app",
        messagingSenderId: "487791641568",
        appId: "1:487791641568:web:55df83e7668da810e62185"
      };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      
      const querySnapshot = await getDocs(collection(db, "portfolioItems"));
      
      if (querySnapshot.empty) {
        container.innerHTML = '<p>No portfolio items yet. Add some via admin panel.</p>';
        return;
      }
      
      let html = '';
      querySnapshot.forEach((doc) => {
        const item = doc.data();
        html += `
          <div class="portfolio-card" style="background: var(--surface); border-radius: 1rem; overflow: hidden; box-shadow: var(--shadow); transition: var(--transition);">
            ${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.title)}" style="width:100%; height:200px; object-fit:cover;">` : '<div style="height:200px; background:#e5e7eb; display:flex; align-items:center; justify-content:center;">No Image</div>'}
            <div style="padding: 1.5rem;">
              <h3>${escapeHtml(item.title)}</h3>
              <p>${escapeHtml(item.description || '')}</p>
              <span class="btn-outline" style="display:inline-block; padding:0.5rem 1rem; border-radius:2rem; font-size:0.875rem;">${escapeHtml(item.category || 'web')}</span>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    } catch (error) {
      console.error("Portfolio error:", error);
      container.innerHTML = `<p style="color:red;">Failed to load portfolio: ${error.message}. Check Firestore rules and console.</p>`;
    }
    
    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
  })();
</script>
</body>
</html>
