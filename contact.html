<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Baba Deep Singh Infotech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">🟢 BABA DEEP SINGH INFOTECH</a>
    <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </div>
</nav>

<main class="container section">
  <h1>Get In Touch</h1>
  <div class="contact-grid">
    <div>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn">Send Message <i class="fas fa-paper-plane"></i></button>
      </form>
    </div>

    <div>
      <h3>Contact Information</h3>
      <p><i class="fas fa-phone"></i> +91 8221826243</p>
      <p><i class="fas fa-envelope"></i> drgagan.10@gmail.com</p>
      <p><i class="fas fa-map-marker-alt"></i> Amritsar, Punjab, India</p>
      <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d54294.7547170601!2d74.800151!3d31.634022!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x391964aa569e7355%3A0xeea2604bee5104c5!2sAmritsar%2C%20Punjab!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin" allowfullscreen loading="lazy"></iframe>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p>&copy; 2025 Baba Deep Singh Infotech. All rights reserved.</p>
  </div>
</footer>

<a href="#" onclick="startProject()" class="whatsapp-float"><i class="fab fa-whatsapp"></i></a>

<script>
  // Mobile menu toggle
  const menuBtn = document.querySelector(".mobile-menu-btn");
  const navLinks = document.querySelector(".nav-links");
  if (menuBtn && navLinks) {
    menuBtn.addEventListener("click", () => {
      navLinks.classList.toggle("active");
    });
  }

  // Initialize EmailJS with your public key
  emailjs.init("rlXeEwQavySY-vgsp");

  const contactForm = document.getElementById("contactForm");
  if (contactForm) {
    contactForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = contactForm.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      submitBtn.disabled = true;

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;

      try {
        // Send email via EmailJS (to your Gmail)
        await emailjs.send(
          "service_bjm8g8n",
          "template_ohu9jyy",
          { name, email, message }
        );

        // Also save to Firestore (for admin panel)
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js");
        const { getFirestore, collection, addDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js");
        
        const firebaseConfig = {
          apiKey: "AIzaSyAbeKLO-fq6vwjx8Fyd3ONa_WdIVTi58k4",
          authDomain: "bdsifotech.firebaseapp.com",
          projectId: "bdsifotech",
          storageBucket: "bdsifotech.firebasestorage.app",
          messagingSenderId: "487791641568",
          appId: "1:487791641568:web:55df83e7668da810e62185"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        await addDoc(collection(db, "contactMessages"), { name, email, message, timestamp: serverTimestamp() });

        alert("✅ Message sent successfully! We'll get back to you soon.");
        contactForm.reset();
      } catch (error) {
        console.error("Error:", error);
        alert("❌ Failed to send. Error: " + error.message);
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
